[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adbpush"
version = "0.1.0"
description = "ADB file manager for Android devices"
requires-python = ">=3.9"
dependencies = ["PyQt6>=6.6"]

[project.scripts]
adbpush = "adbpush.main:main"

[tool.setuptools.packages.find]
where = ["src"]
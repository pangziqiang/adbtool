[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adbtool"
version = "0.1.0"
description = "Android ADB 综合工具箱：文件管理、应用管理、投屏、刷机"
requires-python = ">=3.9"
dependencies = ["PyQt6>=6.6"]

[project.scripts]
adbtool = "adbtool.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# 本工具是本地 GUI，故意吞掉异常的降级路径属于预期行为，且时区固定为本地。
ignore = ["BLE001", "S110", "S112", "DTZ005", "DTZ006", "EXE002"]
